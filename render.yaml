services:
  - type: web
    name: juegobzr-emafz
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGINS
        value: https://emafz.github.io,https://juegobzr-emafz.onrender.com,http://localhost:5173,http://127.0.0.1:5173